[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
# Hardware codec probing is implemented locally in src/hardware_codecs.rs rather
# than depending on the zovyra-native crate, which is built for the Node.js NAPI
# addon and is not safe to link into a non-Node host process (napi-rs requires
# its generated code to resolve against a live Node-API runtime). See that
# module's doc comment for details.
# ffmpeg-next is built from source (bundled) so end users don't need to install
# FFmpeg system-wide. The "build" feature drives the ffmpeg-sys-next build script
# that compiles libav* from vendored sources and statically links them into the
# Tauri binary.  hardware_codecs::probe_hardware_codecs() gracefully degrades to
# all-false if ffmpeg::init() fails at runtime, so the app always starts.
ffmpeg-next = { version = "6.1.1", features = ["build"] }
