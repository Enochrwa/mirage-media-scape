content_security_policy:
  directives:
    default-src:
      - "'self'"
    script-src:
      - "'self'"
      - "'unsafe-inline'"
    style-src:
      - "'self'"
      - "'unsafe-inline'"
    img-src:
      - "'self'"
      - data:
      - https:
    font-src:
      - "'self'"
      - data:
    connect-src:
      - "'self'"
      - ws:
      - wss:

headers:
  X-Content-Type-Options: nosniff
  X-Frame-Options: DENY
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: geolocation=(), microphone=(), camera=()

cors:
  origin: |
    http://localhost:3000
    http://localhost:5173
    http://localhost:3001
  credentials: true
  methods:
    - GET
    - POST
    - PUT
    - DELETE
    - PATCH
    - OPTIONS

rate_limiting:
  enabled: true
  window_ms: 900000
  max_requests: 100
