name: Zovyra CI/CD

on:
  push:
    branches:
      - main
      - develop
      - staging
    paths-ignore:
      - 'docs/**'
      - '**.md'

  pull_request:
    branches:
      - main
      - develop
      - staging

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io

jobs:
  quality:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [22]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install
          cd ../server && npm install

      - name: Frontend - Format check
        run: cd frontend && npm run format:check
        continue-on-error: true

      - name: Frontend - Lint
        run: cd frontend && npm run lint

      - name: Frontend - Type check
        run: cd frontend && npm run type-check

      - name: Server - Lint
        run: cd server && npm run lint
        continue-on-error: true

      - name: Security audit
        run: npm audit --audit-level=high 2>/dev/null || echo "Audit warnings present"
        continue-on-error: true

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: quality

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install
          cd ../server && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Build server
        run: cd server && npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 5

      - name: Upload server artifacts
        uses: actions/upload-artifact@v4
        with:
          name: server-build
          path: server/dist/
          retention-days: 5

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          cd server && npm install

      - name: Run server tests
        run: cd server && npm test -- --coverage --bail

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./server/coverage/coverage-final.json
          flags: server
          fail_ci_if_error: false

  security:
    name: Security Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: |
          npm install
          cd frontend && npm install
          cd ../server && npm install

      - name: Run npm audit
        run: npm audit --production 2>/dev/null || echo "Security vulnerabilities present"
        continue-on-error: true

      - name: Check node security advisories
        run: npx snyk test --severity-threshold=high 2>/dev/null || echo "Snyk scan skipped"
        continue-on-error: true

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [quality, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  dependency-check:
    name: Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for outdated dependencies
        run: |
          npm outdated || echo "Outdated dependencies present"

      - name: Validate dependencies
        run: npm install --prefer-offline --no-audit

  notification:
    name: Notification
    runs-on: ubuntu-latest
    needs: [quality, build, test]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.quality.result }}" = "failure" ] || [ "${{ needs.build.result }}" = "failure" ] || [ "${{ needs.test.result }}" = "failure" ]; then
            echo "Pipeline had failures"
            exit 1
          fi
