[package]
name = "zovyra-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"

# KEEP build feature enabled
ffmpeg-next = { version = "6.1.1", features = ["build"] }

hound = "3.5"
realfft = "3.3"
stratum-dsp = "1.0"
itertools = "0.12"
chromaprint = "0.1"
rayon = "1.10"
lofty = "0.24"

image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
napi-build = "2.0"