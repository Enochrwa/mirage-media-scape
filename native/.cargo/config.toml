[build]
target = "x86_64-unknown-linux-gnu"

[env]
# ffmpeg-sys build configuration: download and statically link FFmpeg.
# Without these, cargo tries to find system FFmpeg dev libraries (libavcodec-dev, …)
# and the build fails on clean / CI machines.
FFMPEG_DOWNLOAD_BUILD = "1"
FFMPEG_STATIC = "1"
FFMPEG_VERSION = "7.1.1"
