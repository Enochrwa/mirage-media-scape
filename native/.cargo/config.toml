[package]
name = "zovyra-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2.12.2", default-features = false, features = ["napi4"] }
napi-derive = "2.12.2"
ffmpeg-next = { version = "6.1.0", features = ["build"] }
hound = "3.5.0"
realfft = "3.3.0"
stratum-dsp = "1.0"
itertools = "0.12"
rayon = "1.10"
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

[build-dependencies]
napi-build = "2.0.1"